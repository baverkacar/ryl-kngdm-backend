spring.application.name=app

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

info.app.name=backend-engineering-case-study
info.app.description=Dream Games Backend Engineering Study
info.app.environment=local

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://case-mysqldb:3306/mysql-db
spring.datasource.username=root
spring.datasource.password=password

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.show-actuator=true

spring.data.redis.host=case-redis
spring.data.redis.port=6379
